<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

<script>
  // Datele tale din Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyCJxFox3puC2aDapW9peyPgOLhIVMyzI4c",
    authDomain: "location-demo-64338.firebaseapp.com",
    databaseURL: "https://location-demo-64338-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "location-demo-64338",
    storageBucket: "location-demo-64338.firebasestorage.app",
    messagingSenderId: "884756282803",
    appId: "1:884756282803:web:8724805c2c32d3273b5fc6",
    measurementId: "G-ZNEXFC2EBB"
  };

  // Inițializare
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  // Funcția care ia locația și o trimite automat
  function getLocation() {
    fetch('https://ipapi.co/json/')
      .then(response => response.json())
      .then(data => {
        const payload = {
          lat: data.latitude,
          lon: data.longitude,
          oras: data.city,
          tara: data.country_name,
          ip: data.ip,
          timp: new Date().toLocaleString()
        };

        // Salvare în Firebase
        database.ref('vizitatori').push(payload)
          .then(() => {
            console.log("Date trimise!");
            document.getElementById("result").innerText = "Conexiune reușită.";
          })
          .catch(err => console.error("Eroare Firebase:", err));
      })
      .catch(err => console.error("Eroare IP API:", err));
  }

  // Pornire automată la încărcarea paginii
  window.onload = getLocation;
</script>
