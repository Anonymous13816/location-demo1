<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

<script>
  // ACEEAȘI CONFIGURAȚIE CA MAI SUS
  const firebaseConfig = {
  apiKey: "AIzaSyCJxFox3puC2aDapW9peyPgOLhIVMyzI4c",
  authDomain: "location-demo-64338.firebaseapp.com",
  databaseURL: "https://location-demo-64338-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "location-demo-64338",
  storageBucket: "location-demo-64338.firebasestorage.app",
  messagingSenderId: "884756282803",
  appId: "1:884756282803:web:8724805c2c32d3273b5fc6",
  measurementId: "G-ZNEXFC2EBB"

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  // Citim datele din tabelul 'vizitatori'
  database.ref('vizitatori').on('value', (snapshot) => {
    const data = snapshot.val();
    const container = document.getElementById("lista-locatii");
    container.innerHTML = ""; // Resetăm lista

    for (let id in data) {
      let vizitator = data[id];
      container.innerHTML += `
        <div style="border-bottom: 1px solid #ccc; padding: 10px;">
          <b>Data:</b> ${vizitator.data_acces} <br>
          <b>Oraș:</b> ${vizitator.oras} (${vizitator.ip}) <br>
          <b>Coordonate:</b> ${vizitator.lat}, ${vizitator.lon} <br>
          <a href="https://www.google.com/maps?q=${vizitator.lat},${vizitator.lon}" target="_blank">Vezi pe Hartă</a>
        </div>
      `;
    }
  });
</script>

<div id="lista-locatii">Așteptare date...</div>
