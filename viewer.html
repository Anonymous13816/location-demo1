<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Panou Control - Locații</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .vizita { 
            background: white; border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px; padding: 15px; border-left: 5px solid #007bff;
        }
        .maps-link { display: inline-block; margin-top: 10px; color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <h1>📍 Vizitatori înregistrați în Firebase</h1
     <div style="margin: 20px;">
    <button onclick="stergeTot()" style="background: #ff4444; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
        🗑️ Șterge tot istoricul
    </button>
</div>

<script>
// Funcția de ștergere (adaugă-o în secțiunea de <script> existentă)
function stergeTot() {
    if(confirm("Ești sigur că vrei să golești toată baza de date?")) {
        database.ref('vizite').remove()
            .then(() => {
                alert("Toate datele au fost șterse!");
                location.reload(); // Reîncarcă pagina ca să se curețe lista
            })
            .catch(err => alert("Eroare la ștergere: " + err));
    }
}
</script>                                            
    <div id="lista">Se încarcă datele...</div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        // Configurația TA exactă
        const firebaseConfig = {
            apiKey: "AIzaSyCJxFox3puC2aDapW9peyPgOLhIVMyzI4c",
            authDomain: "location-demo-64338.firebaseapp.com",
            databaseURL: "https://location-demo-64338-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "location-demo-64338",
            storageBucket: "location-demo-64338.firebasestorage.app",
            messagingSenderId: "884756282803",
            appId: "1:884756282803:web:8724805c2c32d3273b5fc6"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ASCULTĂM TABELUL 'vizite' (cel în care trimite index.html)
        database.ref('vizite').on('value', (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById("lista");
            container.innerHTML = ""; 

            if(!data) {
                container.innerText = "Momentan nu există vizite în baza de date.";
                return;
            }

            // Convertim obiectul în listă și o inversăm (cele mai noi sus)
            const entries = Object.entries(data).reverse();

            entries.forEach(([id, v]) => {
                const item = document.createElement('div');
                item.className = 'vizita';
                item.innerHTML = `
                    <b>🕒 Data:</b> ${v.data || v.timp} <br>
                    <b>🌐 IP:</b> ${v.ip} <br>
                    <b>📍 Oraș:</b> ${v.oras}, ${v.tara} <br>
                    <b>📡 Coordonate:</b> ${v.lat}, ${v.lon} <br>
                    <b>🏢 Furnizor:</b> ${v.furnizor || 'N/A'} <br>
                    <a class="maps-link" href="https://www.google.com/maps?q=${v.lat},${v.lon}" target="_blank">🗺️ Deschide în Google Maps</a>
                `;
                container.appendChild(item);
            });
        });
    </script>
</body>
</html>
